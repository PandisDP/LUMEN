<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LUMEN 3D: compara sitios y fechas de alunizaje en el polo sur lunar según la posición del Sol y la Tierra sobre el horizonte real (LOLA)."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    />
    <title>LUMEN 3D · Polo Sur lunar</title>
    <script>
      // Theme before first paint: dark unless the user chose light (see src/ui/theme.ts).
      try {
        if (localStorage.getItem('lumen-theme') !== 'light')
          document.documentElement.classList.add('dark')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
