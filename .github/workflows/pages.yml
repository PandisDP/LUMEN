name: Deploy to GitHub Pages

# Publishes the static build at https://<owner>.github.io/<repo>/ on every push to main.
# `workflow_dispatch` lets any branch be published by hand (e.g. a feature branch for review).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Project site: assets and data live under /<repo>/ (import.meta.env.BASE_URL).
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Manual fallback while GitHub Actions is unavailable for the account (billing lock):
#   npx vite build --base=/LUMEN/ && touch dist/.nojekyll
#   cd dist && git init -b gh-pages && git add -A && git commit -m deploy \
#     && git push -f https://github.com/PandisDP/LUMEN.git gh-pages
# and set Pages to "Deploy from a branch: gh-pages /" in the repository settings.
